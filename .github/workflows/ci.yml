name: MCN CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']   # oldest supported and current
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install MCN and playground dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r mcn/web-playground/requirements.txt pytest

    - name: Run example scripts (as in the README Quick Start)
      run: |
        mcn run examples/hello.mcn
        mcn run examples/business.mcn

    - name: Run test suite (regressions + web playground)
      run: python -m pytest

    - name: Playground server starts and answers locally
      run: |
        python mcn/web-playground/server.py --port 5003 &
        for i in $(seq 1 20); do curl -sf http://127.0.0.1:5003/api/health && break; sleep 1; done
        curl -sf http://127.0.0.1:5003/api/health

  e2e-react:
    # Compile the React app generated from every template
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install MCN
      run: |
        pip install -e .
        pip install -r mcn/web-playground/requirements.txt pytest
    - name: Type-check generated React apps
      env:
        MCN_E2E_REACT: '1'
      run: python -m pytest tests/test_templates_e2e.py -k typechecks
    - name: Type-check the UI kit and check its preview bundle is up to date
      working-directory: mcn/ui-kit/react
      run: |
        npm ci --no-audit --no-fund
        npx tsc --noEmit
        node build.mjs
        git diff --exit-code -- ../../web-playground/static/preview \
          || (echo "::error::Run 'npm run build' in mcn/ui-kit/react and commit static/preview"; exit 1)

  e2e-flutter:
    # Analyze the Flutter app generated from every template
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Install MCN
      run: |
        pip install -e .
        pip install -r mcn/web-playground/requirements.txt pytest
    - name: Analyze generated Flutter apps
      env:
        MCN_E2E_FLUTTER: '1'
      run: python -m pytest tests/test_templates_e2e.py -k analyzes

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Security Scan
      uses: pypa/gh-action-pip-audit@v1.0.8
      with:
        inputs: requirements.txt

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.before }}
        head: ${{ github.sha }}
        extra_args: --only-verified
      continue-on-error: true

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install quality tools
      run: |
        pip install black flake8 mypy

    - name: Check code formatting
      run: black --check .
      continue-on-error: true

    - name: Lint code
      run: flake8 mcn/ --max-line-length=88 --exclude=mcn/studio,mcn/web-playground
      continue-on-error: true

    - name: Type check
      run: mypy mcn/ --ignore-missing-imports --exclude-dir=mcn/studio --exclude-dir=mcn/web-playground
      continue-on-error: true
