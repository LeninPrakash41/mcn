<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCN Developer Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root { --bg:#f7f6f3; --card:#ffffff; --text:#1d1d1b; --muted:#6b6a65; --line:#e6e4de; --accent:#c4664a; --accent-bg:#f6e7e1;
  --gold:#9a7417; --gold-bg:#fbf1d9; --green:#2f7d4f; --green-bg:#e3f2e8; --hero:#1f1d1a; }
@media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1d1d1d; --text:#ececec; --muted:#9b9b96; --line:#2c2c2c;
  --accent:#e08a6c; --accent-bg:#3a2a24; --gold:#e3b54a; --gold-bg:#3a3020; --green:#6cc290; --green-bg:#1f3328; --hero:#0d0d0d; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 22px; padding: 12px 24px;
  background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 650; display: flex; align-items: center; gap: 10px; color: var(--text); white-space: nowrap; }
.brand b { background: var(--accent); color: #fff; border-radius: 7px; width: 26px; height: 26px; display: grid; place-items: center; font-size: 13px; }
nav { display: flex; gap: 4px; flex: 1; overflow-x: auto; }
nav a { color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
nav a:hover { color: var(--text); background: var(--bg); text-decoration: none; }
nav a.on { color: var(--text); background: var(--bg); font-weight: 550; }

.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border: 0; border-radius: 9px;
  padding: 9px 16px; font-weight: 550; cursor: pointer; white-space: nowrap; }
.btn:hover { text-decoration: none; filter: brightness(1.05); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.btn.liked { background: var(--accent-bg); color: var(--accent); }
main { max-width: 1120px; margin: 0 auto; padding: 0 20px 70px; }
.hero { margin: 0 calc(50% - 50vw) 28px; padding: 46px 20px 40px; background: var(--hero); color: #f4f1ec; }
.hero-in { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 30px; align-items: center; }
.hero h1 { font-size: 34px; line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.02em; }
.hero p { color: #c9c4bb; margin: 0 0 20px; max-width: 560px; }
.hero .nums { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.hero .nums div { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; }
.hero .nums b { display: block; font-size: 24px; } .hero .nums span { color: #b9b3a8; font-size: 13px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 0 0 30px; }
.step { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.step i { font-style: normal; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
.step b { display: block; margin-bottom: 2px; } .step span { color: var(--muted); font-size: 13px; }
h1.page { font-size: 28px; margin: 30px 0 6px; letter-spacing: -0.01em; } h2 { font-size: 19px; margin: 30px 0 12px; }
.lead { color: var(--muted); margin: 0 0 20px; max-width: 760px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.search, select.sort { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
.search { flex: 1; min-width: 220px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin-top: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; color: var(--text); }
a.card:hover { text-decoration: none; border-color: var(--accent); transform: translateY(-1px); transition: .12s; }
.card h3 { margin: 0; font-size: 16px; } .muted { color: var(--muted); font-size: 13px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--accent-bg); color: var(--accent); white-space: nowrap; }
.badge.award { background: var(--gold-bg); color: var(--gold); } .badge.spot { background: var(--green-bg); color: var(--green); }
.badge.kind { background: var(--bg); color: var(--muted); }
.meter { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; margin-top: auto; }
.meter b { color: var(--text); font-weight: 600; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; grid-column: 1 / -1; }
.cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rank { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 0; }
.rank h3 { margin: 8px 16px 6px; font-size: 15px; }
.rank a { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 8px 16px; color: var(--text); }
.rank a:hover { background: var(--bg); text-decoration: none; }
.rank em { font-style: normal; color: var(--muted); font-weight: 600; } .rank small { color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; } th { color: var(--muted); font-weight: 550; font-size: 12.5px; }
tr:last-child td { border-bottom: 0; }
.pjhead { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; margin: 28px 0 10px; }
.pjhead h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -0.01em; }
.statrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 96px; }
.stat b { display: block; font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
pre { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow: auto; font: 12.5px/1.5 ui-monospace, Menlo, monospace; max-height: 440px; }
.note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
.verify { display: flex; gap: 8px; flex-wrap: wrap; max-width: 560px; }
/* ── My club and Review ── */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--text); border-color: var(--accent); font-weight: 550; }
.form { display: grid; gap: 12px; max-width: 560px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.form input, .form select, .form textarea, .field { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; width: 100%; }
.form input:focus, .form textarea:focus, .field:focus { outline: none; border-color: var(--accent); }
.err { color: #c0392b; font-size: 13px; } .err:empty { display: none; }
.status { font-size: 12px; padding: 2px 9px; border-radius: 6px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.status.s-approved, .status.s-open { background: var(--green-bg); color: var(--green); }
.status.s-in_review, .status.s-judging { background: var(--accent-bg); color: var(--accent); }
.status.s-changes_requested { background: var(--gold-bg); color: var(--gold); }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.list { display: grid; gap: 12px; }
.scores { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); } .scores b { color: var(--text); }
.split { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 18px; align-items: start; }
.qitem { cursor: pointer; } .qitem:hover, .qitem.on { border-color: var(--accent); }
.crit { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 4px; } .dots input { display: none; }
.dots span { display: inline-grid; place-items: center; min-width: 32px; height: 32px; padding: 0 6px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 13px; }
.dots input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.table-wrap { overflow-x: auto; } .table-wrap td, .table-wrap th { white-space: nowrap; }
.pill-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.pill-btn.on { background: var(--gold-bg); border-color: var(--gold); color: var(--gold); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
details.card summary { cursor: pointer; font-weight: 550; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } .crit { grid-template-columns: 1fr; } }
/* ── Friendlier marketplace ── */
.who { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); padding: 5px 10px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }
.who:hover { text-decoration: none; border-color: var(--accent); }
.who.out { padding: 7px 14px; font-weight: 550; }
.av { display: inline-grid; place-items: center; border-radius: 50%; font-weight: 650; color: #fff; flex-shrink: 0; }
.hero.compact { padding: 40px 20px 34px; background: var(--hero); }
.hero.compact .wrap { max-width: 1080px; margin: 0 auto; }
.hero.compact h1 { font-size: 36px; margin: 0 0 8px; }
.hero.compact p { margin: 0 0 22px; }
.hero-search { display: flex; gap: 10px; max-width: 720px; flex-wrap: wrap; }
.hero-search input { flex: 1; min-width: 240px; padding: 14px 16px; border-radius: 12px; border: 0; font: inherit; font-size: 15px; background: #fff; color: #1d1d1b; }
.hero-search .btn { padding: 13px 18px; }
.hero-nums { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 18px; color: #c9c4bb; font-size: 14px; }
.hero-nums b { color: #fff; font-size: 16px; margin-right: 4px; }
.filterbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin: 4px 0 6px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 9px; cursor: pointer; }
.seg button.on { background: var(--text); color: var(--bg); font-weight: 550; }
.selects { display: flex; gap: 8px; flex-wrap: wrap; }
.result-note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.app { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; color: var(--text); transition: transform .15s, box-shadow .15s, border-color .15s; }
.app:hover { box-shadow: 0 8px 24px rgba(0,0,0,.06); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); text-decoration: none; }
.cover, .pj-cover { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: color-mix(in srgb, var(--tint) 11%, var(--card)); border-bottom: 1px solid color-mix(in srgb, var(--tint) 18%, var(--line)); }
.cover { height: 76px; }
.mono { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: color-mix(in srgb, var(--tint) 20%, var(--card)); color: color-mix(in srgb, var(--tint) 80%, var(--text)); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.cover .cat, .pj-cover .cat { font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--tint) 75%, var(--text)); }
.app-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.app-body h3 { margin: 0; font-size: 16.5px; }
.app-by { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.app-by b { color: var(--text); font-weight: 600; display: block; }
.stats-line { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.stats-line b { color: var(--text); }
.howto { margin: 40px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }
.howto h2 { margin: 0 0 14px; }
.howto .steps { margin: 0 0 16px; }
.hire { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; background: color-mix(in srgb, var(--green-bg) 60%, var(--card)); border: 1px solid color-mix(in srgb, var(--green) 25%, var(--line)); border-radius: 14px; padding: 12px 16px; margin: 4px 0 6px; }
.hire div { display: flex; flex-direction: column; gap: 2px; } .hire b { color: var(--green); }
.avail { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.avail legend { font-weight: 600; padding: 0 6px; color: var(--text); }
.check { display: flex !important; flex-direction: row !important; align-items: flex-start; gap: 8px; color: var(--text) !important; }
.builder h3 { margin: 0; }
.bhead { display: flex; align-items: center; gap: 12px; } .bhead > div { min-width: 0; }
.site-foot { border-top: 1px solid var(--line); margin-top: 50px; padding: 26px 24px 34px; display: flex; flex-wrap: wrap; gap: 14px 30px; justify-content: space-between; max-width: 1120px; margin-left: auto; margin-right: auto; color: var(--muted); font-size: 13.5px; }
.site-foot div { display: flex; flex-direction: column; gap: 3px; } .site-foot b { color: var(--text); }
.site-foot nav { display: flex; flex-wrap: wrap; gap: 6px 18px; flex: none; overflow: visible; }
.site-foot nav a { color: var(--muted); padding: 0; } .site-foot nav a:hover { color: var(--text); background: none; }
.pj-cover { height: 96px; border-radius: 16px; margin-top: 22px; border: 1px solid color-mix(in srgb, var(--tint) 18%, var(--line)); padding: 18px 22px; }
.pj-cover .mono { width: 56px; height: 56px; font-size: 20px; border-radius: 14px; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; }

/* ── Certificate ── */
.cert-wrap { padding: 26px 0 10px; }
.sheet { --c: #c4664a; --c2: #8a4b37; position: relative; width: 100%; max-width: 1060px; aspect-ratio: 297 / 210; margin: 0 auto;
  background: #fffdf7; color: #24211c; font-family: "Cormorant Garamond", Georgia, serif; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,0.18); container-type: inline-size; }
.sheet.certified { --c: #1f6f78; --c2: #164e55; } .sheet.award { --c: #b08a2e; --c2: #7d6220; }
.sheet::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--c) 9%, transparent) 0 40%, transparent 41%),
              repeating-radial-gradient(circle at 50% 50%, transparent 0 9px, color-mix(in srgb, var(--c) 5%, transparent) 9px 10px); opacity: .9; }
.frame { position: absolute; inset: 2.4cqw; border: 0.35cqw solid var(--c); }
.frame::after { content: ""; position: absolute; inset: 0.9cqw; border: 0.12cqw solid color-mix(in srgb, var(--c) 70%, transparent); }
.corner { position: absolute; width: 8cqw; height: 8cqw; color: var(--c); }
.corner.tl { top: 1.4cqw; left: 1.4cqw; } .corner.tr { top: 1.4cqw; right: 1.4cqw; transform: scaleX(-1); }
.corner.bl { bottom: 1.4cqw; left: 1.4cqw; transform: scaleY(-1); } .corner.br { bottom: 1.4cqw; right: 1.4cqw; transform: scale(-1); }
.inner { position: absolute; inset: 6cqw 8cqw 5cqw; display: flex; flex-direction: column; align-items: center; text-align: center; }
.emblem { width: 9cqw; height: 9cqw; color: var(--c); }
.club-name { font-family: Inter, sans-serif; letter-spacing: .35em; font-size: 1.15cqw; color: var(--c2); text-transform: uppercase; margin-top: 1cqw; font-weight: 600; }
.cert-title { font-size: 5.2cqw; font-weight: 600; margin: 1.6cqw 0 0; line-height: 1.05; color: #1f1c17; }
.cert-kind { font-family: Inter, sans-serif; font-size: 1.15cqw; letter-spacing: .28em; text-transform: uppercase; color: var(--c2); margin-top: .8cqw; }
.presented { font-size: 1.9cqw; font-style: italic; color: #5b5549; margin-top: 2.6cqw; }
.holder { font-size: 5cqw; font-style: italic; font-weight: 600; margin-top: .4cqw; padding: 0 4cqw .4cqw; border-bottom: 0.12cqw solid color-mix(in srgb, var(--c) 55%, transparent); color: #1f1c17; }
.holder-org { font-family: Inter, sans-serif; font-size: 1.35cqw; color: #5b5549; margin-top: 1cqw; }
.statement { font-size: 2cqw; line-height: 1.4; max-width: 62cqw; margin-top: 2cqw; color: #3a352d; }
.statement b { color: #1f1c17; }
.foot { margin-top: auto; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 3cqw; font-family: Inter, sans-serif; }
.foot .col { font-size: 1.2cqw; color: #5b5549; } .foot .col.right { text-align: right; }
.foot .line { border-top: 0.1cqw solid #8d857a; padding-top: .6cqw; margin-top: .6cqw; }
.foot .big { font-family: "Cormorant Garamond", Georgia, serif; font-size: 2cqw; color: #1f1c17; font-style: italic; }
.seal { width: 11cqw; height: 11cqw; color: var(--c); }
.qr { position: absolute; right: 6.4cqw; top: 6cqw; display: flex; flex-direction: column-reverse; align-items: center; gap: .5cqw; font-family: Inter, sans-serif; font-size: .9cqw; line-height: 1.3; color: #6b645a; text-align: center; }
.qr svg { width: 6.5cqw; height: 6.5cqw; background: #fff; }
.cert-tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 22px 0 6px; }
.valid { text-align: center; color: var(--green); font-size: 14px; }
@media print {
  @page { size: A4 landscape; margin: 0; }
  header, .no-print { display: none !important; }
  body { background: #fff; } main { padding: 0; max-width: none; } .cert-wrap { padding: 0; }
  .sheet { max-width: none; width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; }
}
@media (max-width: 760px) {
  .hero-search .btn { display: none; } .hero.compact h1 { font-size: 30px; }
  .hero-in, .cols, .steps { grid-template-columns: 1fr; } .pjhead { grid-template-columns: 1fr; } header { gap: 8px 10px; padding: 10px 14px; flex-wrap: wrap; } header > .btn { margin-left: auto; padding: 7px 12px; font-size: 14px; } nav { order: 3; flex-basis: 100%; margin: 0 -6px; } .who { display: none; }
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/club"><b>M</b> MCN Developer Club</a>
  <nav id="nav">
    <a href="/club" data-v="market">Marketplace</a>
    <a href="/club/seasons" data-v="seasons">Seasons</a>
    <a href="/club/leaderboard" data-v="leaderboard">Leaderboard</a>
    <a href="/club/awards" data-v="awards">Awards</a>
    <a href="/club/builders" data-v="builders">Hire a builder</a>
    <a href="/club/me" data-v="me" id="nav-me">My club</a>
    <a href="/club/review" data-v="review" id="nav-review" hidden>Review</a>
  </nav>
  <a class="who" id="who" href="/?signin=club">Sign in</a>
  <a class="btn" href="/?club=launch">Publish your app</a>
</header>
<main id="view"><div class="empty" style="margin-top:30px">Loading…</div></main>
<footer class="site-foot no-print">
  <div><b>MCN Developer Club</b><span>Build apps in MCN, get them reviewed, get certified.</span></div>

<script>
const $view = document.getElementById('view')
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const day = t => t ? new Date(t * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : ''
let INFO = { awards: {}, spotlights: {}, kinds: {}, sorts: {}, counts: {} }
const state = { view: 'all', category: '', q: '', sort: 'newest', season: '' }
let SEASONS = [], ME = null
const ordered = g => ((INFO.order || {})[g] || Object.keys(INFO[g] || {})).map(k => [k, INFO[g][k]])
const AWARD_ABOUT = {
  best_overall: 'The app that is best all round: useful, polished, well built.',
  best_innovation: 'A new idea, or a fresh take on an old problem.',
  best_technical: 'Excellent engineering: clean structure, types, tests, modules.',
  best_use_of_mcn: 'Gets the most out of MCN: services, screens, agents, the app map.',
  best_ai: 'Puts AI to work where it truly helps people.',
}

function token() { try { return localStorage.getItem('mcn_token') || '' } catch { return '' } }
async function api(path, body) {
  const headers = { Accept: 'application/json' }
  if (token()) headers.Authorization = 'Bearer ' + token()
  const opts = { headers, credentials: 'same-origin' }
  if (body !== undefined) { opts.method = 'POST'; headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body) }
  const r = await fetch(path, opts)
  return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) }
}
const count = (n, word) => `${n || 0} ${word}${Number(n) === 1 ? '' : 's'}`
function toast(text) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = text; document.body.append(t); setTimeout(() => t.remove(), 2400) }
function setNav(v) { document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v)) }

function badges(p) {
  const out = (p.awards || []).map(a => `<span class="badge award">${esc(a.label)}${a.season ? ' · ' + esc(a.season) : ''}</span>`)
  if (p.spotlight_label) out.push(`<span class="badge spot">${esc(p.spotlight_label)}</span>`)
  return out.join('')
}
function meter(p) {
  const u = p.usage || {}
  return `<div class="meter"><span><b>${u.uses || 0}</b> using</span><span><b>${u.likes || 0}</b> likes</span>
    <span>${count((p.stats || {}).screens, 'screen')} · ${count((p.stats || {}).endpoints, 'endpoint')}${(p.stats || {}).uses_ai ? ' · AI' : ''}</span></div>`
}
function author(p) {
  return `<a href="/club/u/${esc(p.user_id)}">${esc(p.author)}</a> · ${esc(p.author_org)} <span class="badge kind">${esc(INFO.kinds[p.author_kind] || '')}</span>`
}
// A look per category, so apps are easy to tell apart at a glance
// A muted tint per category, in the club's warm palette, so apps are easy to tell apart
const CATEGORY_TINT = {
  AI: '#8b6fb3', Business: '#4f7aa8', Education: '#c4664a', Health: '#4f8a6b', Finance: '#7a8a4f',
  IoT: '#4a8a99', 'Social good': '#b0607a', Tools: '#7a7468', Other: '#9a7a4a',
}
const tint = c => CATEGORY_TINT[c] || CATEGORY_TINT.Other
const coverStyle = c => `--tint:${tint(c)}`
const monogram = t => String(t || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('')
function avatar(name, size = 30) {
  const initials = String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'
  let h = 0; for (const ch of String(name || '')) h = (h * 31 + ch.charCodeAt(0)) % 360
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * 0.4)}px;background:hsl(${h} 22% 46%)">${esc(initials)}</span>`
}
function card(p) {
  const u = p.usage || {}, st = p.stats || {}
  return `<a class="app" href="/club/project/${esc(p.id)}">
    <div class="cover" style="${coverStyle(p.category)}"><span class="mono">${esc(monogram(p.title))}</span><span class="cat">${esc(p.category || 'App')}</span></div>
    <div class="app-body">
      <h3>${esc(p.title)}</h3>
      <div class="muted">${esc(p.tagline || '')}</div>
      ${badges(p) || p.season ? `<div class="badges">${p.season ? `<span class="badge kind">${esc(p.season.name)}</span>` : ''}${badges(p)}</div>` : ''}
      <div class="app-by">${avatar(p.author)}<span><b>${esc(p.author)}</b>${esc(p.author_org)} · ${esc(INFO.kinds[p.author_kind] || '')}</span></div>
      <div class="stats-line"><span><b>${u.uses || 0}</b> using</span><span><b>${u.likes || 0}</b> likes</span>
        <span>${count(st.screens, 'screen')}${st.uses_ai ? ' · AI' : ''}</span></div>
    </div></a>`
}

// ── Marketplace ──────────────────────────────────────────────────────────

const VIEWS = [['all', 'All apps'], ['winners', 'Award winners'], ['spot', 'Spotlighted'], ['student', 'By students'], ['professional', 'By professionals']]
const CATEGORIES = ['AI', 'Business', 'Education', 'Health', 'Finance', 'IoT', 'Social good', 'Tools', 'Other']

async function marketplace() {
  setNav('market')
  const n = INFO.counts || {}
  const member = ME && ME.member
  $view.innerHTML = `
    <section class="hero compact"><div class="wrap">
      <h1>Discover apps built in MCN</h1>
      <p>Made by students and professionals in the MCN Developer Club. Open any of them in Studio to try it or build on it.</p>
      <div class="hero-search"><input id="q" placeholder="Search apps, people, colleges or companies" value="${esc(state.q)}" aria-label="Search">
        <a class="btn" href="/?club=launch">Publish your app</a></div>
      <div class="hero-nums"><span><b>${n.apps || 0}</b>apps</span><span><b>${n.members || 0}</b>members</span>
        <span><b>${n.organizations || 0}</b>colleges & companies</span><span><b>${n.certificates || 0}</b>certificates</span></div>
    </div></section>
    ${openBanner()}
    <div class="filterbar">
      <div class="seg" role="tablist">${VIEWS.map(([k, l]) => `<button role="tab" data-view="${k}" class="${state.view === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="selects">
        <select class="sort" id="category" aria-label="Category"><option value="">All categories</option>${CATEGORIES.map(c => `<option ${state.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        ${SEASONS.length ? `<select class="sort" id="season" aria-label="Season"><option value="">All seasons</option>${SEASONS.map(se => `<option value="${esc(se.id)}" ${state.season === se.id ? 'selected' : ''}>${esc(se.name)}</option>`).join('')}</select>` : ''}
        <select class="sort" id="sort" aria-label="Sort">${Object.entries(INFO.sorts || {}).map(([k, v]) => `<option value="${k}" ${state.sort === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>
      </div>
    </div>
    <p class="result-note" id="note"></p>
    <div id="results" class="grid"></div>
    ${member ? '' : `<section class="howto"><h2>How the club works</h2><div class="steps">
      <div class="step"><i>1</i><b>Join</b><span>Sign in, open My club and add your college or company.</span></div>
      <div class="step"><i>2</i><b>Build</b><span>Make an app in Studio: from scratch, a template or with the Agent.</span></div>
      <div class="step"><i>3</i><b>Publish</b><span>Click Publish in Studio. You get a certificate straight away.</span></div>
      <div class="step"><i>4</i><b>Get listed</b><span>Approved apps appear here, earn certificates and can win awards.</span></div>
    </div><a class="btn" href="${INFO.signed_in ? '/club/me' : '/?signin=club'}">${INFO.signed_in ? 'Join the club' : 'Sign in to join'}</a></section>`}`
  $view.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { state.view = b.dataset.view; marketplace() })
  let t
  document.getElementById('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; results() }, 250) }
  document.getElementById('sort').onchange = e => { state.sort = e.target.value; results() }
  document.getElementById('category').onchange = e => { state.category = e.target.value; results() }
  const se = document.getElementById('season')
  if (se) se.onchange = e => { state.season = e.target.value; results() }
  results()
}

async function results() {
  const v = state.view
  const params = { q: state.q, sort: state.sort, season: state.season, category: state.category,
    award: v === 'winners' ? 'any' : '', spotlight: v === 'spot' ? 'any' : '', kind: ['student', 'professional'].includes(v) ? v : '' }
  const qs = new URLSearchParams(Object.entries(params).filter(([, x]) => x)).toString()
  const { body } = await api('/api/club/marketplace?' + qs)
  const list = body.projects || []
  const filtered = qs.replace(/(^|&)sort=[^&]*/, '')
  document.getElementById('note').innerHTML = filtered
    ? `${list.length} app${list.length === 1 ? '' : 's'} · <a href="#" id="clear">Clear filters</a>` : ''
  const clear = document.getElementById('clear')
  if (clear) clear.onclick = e => { e.preventDefault(); Object.assign(state, { q: '', view: 'all', category: '', season: '' }); marketplace() }
  document.getElementById('results').innerHTML = list.length ? list.map(card).join('')
    : `<div class="empty">${body.error ? esc(body.error) : filtered ? 'No apps match these filters.' : 'No approved apps yet. <a href="/?club=launch">Publish the first one</a>.'}</div>`
}

// ── Seasons ──────────────────────────────────────────────────────────────

function left(t) {
  const d = Math.ceil((t * 1000 - Date.now()) / 86400000)
  return d > 1 ? `${d} days left` : d === 1 ? 'Last day' : 'Closing today'
}

function openBanner() {
  const open = SEASONS.filter(se => se.status === 'open')
  if (!open.length) return ''
  const se = open[0]
  return `<a class="card" href="/club/season/${esc(se.id)}" style="margin:0 0 18px;flex-direction:row;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-color:color-mix(in srgb, var(--accent) 35%, var(--line));background:color-mix(in srgb, var(--accent-bg) 55%, var(--card))">
    <span><b>${esc(se.name)} is open${se.theme ? ': ' + esc(se.theme) : ''}</b> <span class="muted">· entries close ${esc(day(se.ends_at))}, ${esc(left(se.ends_at)).toLowerCase()} · ${se.entries} entries so far</span></span>
    <span class="btn ghost">Enter or see entries →</span></a>`
}

function seasonCard(se) {
  return `<a class="card" href="/club/season/${esc(se.id)}"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(se.name)}</h3>
      <span class="badge ${se.status === 'open' ? 'spot' : se.status === 'closed' ? 'award' : ''}">${esc(se.status_label)}</span></div>
    ${se.theme ? `<div>${esc(se.theme)}</div>` : ''}
    <div class="muted">${esc(day(se.starts_at))} to ${esc(day(se.ends_at))}${se.status === 'open' ? ' · ' + esc(left(se.ends_at)) : ''}</div>
    <div class="meter"><span><b>${se.entries}</b> entries</span><span><b>${se.approved}</b> approved</span></div></a>`
}

async function seasonsPage() {
  setNav('seasons')
  $view.innerHTML = `<h1 class="page">Seasons</h1>
    <p class="lead">Seasons are rounds of the club with a theme and a deadline. Enter an app while a season is open; after it closes,
      reviewers score every entry on the same rubric (overall quality, innovation, technical implementation, use of MCN, use of AI)
      and announce the winners of each award.</p>
    <div class="grid">${SEASONS.length ? SEASONS.map(seasonCard).join('') : '<div class="empty">No seasons yet.</div>'}</div>`
}

async function seasonPage(id) {
  setNav('seasons')
  const { ok, body } = await api('/api/club/seasons/' + encodeURIComponent(id))
  if (!ok) { $view.innerHTML = `<div class="empty" style="margin-top:30px">${esc(body.error || 'Not found')}</div>`; return }
  const se = body.season
  document.title = `${se.name} · MCN Developer Club`
  const winners = se.status === 'closed' ? ordered('awards').map(([k, label]) => (se.winners[k] || []).length
    ? `<h2>${esc(label)}</h2><div class="grid">${se.winners[k].map(card).join('')}</div>` : '').join('') : ''
  $view.innerHTML = `
    <section class="hero"><div class="hero-in">
      <div><p style="margin:0 0 6px;color:#b9b3a8">Season · ${esc(se.status_label)}</p><h1>${esc(se.name)}</h1>
        ${se.theme ? `<p style="font-size:18px;color:#f4f1ec">${esc(se.theme)}</p>` : ''}
        ${se.description ? `<p style="white-space:pre-wrap">${esc(se.description)}</p>` : ''}
        ${se.status === 'open' ? '<a class="btn" href="/?club=launch">Enter your app</a>' : ''}</div>
      <div class="nums"><div><b>${esc(new Date(se.starts_at * 1000).toLocaleDateString())}</b><span>opened</span></div>
        <div><b>${esc(new Date(se.ends_at * 1000).toLocaleDateString())}</b><span>${se.status === 'open' ? esc(left(se.ends_at)) : 'entries closed'}</span></div>
        <div><b>${se.entries.length}</b><span>approved entries</span></div><div><b>${esc(se.status_label)}</b><span>status</span></div></div>
    </div></section>
    ${se.status === 'closed' ? (winners || '<p class="muted">No awards were given this season.</p>') : se.status === 'judging'
      ? '<p class="lead">Entries are closed and reviewers are scoring them. Winners will be announced here.</p>' : ''}
    <h2>Entries</h2><div class="grid">${se.entries.length ? se.entries.map(card).join('') : '<div class="empty">No approved entries yet.</div>'}</div>`
}

// ── Leaderboard and awards ───────────────────────────────────────────────

async function leaderboard() {
  setNav('leaderboard')
  const { body } = await api('/api/club/leaderboard')
  const list = (title, items, key) => `<div class="rank"><h3>${title}</h3>${items.length ? items.map((p, i) => `
    <a href="/club/project/${esc(p.id)}"><em>${i + 1}</em><span>${esc(p.title)}<br><small>${esc(p.author_org)}</small></span>
      <small>${key === 'likes' ? (p.usage.likes + ' likes') : key === 'recent' ? (p.usage.recent_uses + ' this month') : (p.usage.uses + ' using')}</small></a>`).join('')
    : '<div class="empty" style="margin:10px;border:0">Nothing yet</div>'}</div>`
  $view.innerHTML = `
    <h1 class="page">Leaderboard</h1>
    <p class="lead">Apps ranked by how many other registered members use them (open them in Studio) and like them.
      Only other people count: opening or liking your own app doesn't.</p>
    <div class="cols">${list('Most used', body.most_used || [], 'uses')}${list('Most liked', body.most_liked || [], 'likes')}${list('Trending this month', body.trending || [], 'recent')}</div>
    <h2>Top builders</h2>
    ${(body.builders || []).length ? `<table><thead><tr><th>#</th><th>Developer</th><th>College or company</th><th>Apps</th><th>Using their apps</th><th>Awards</th></tr></thead><tbody>
      ${body.builders.map((b, i) => `<tr><td>${i + 1}</td><td><a href="/club/u/${esc(b.user_id)}">${esc(b.name)}</a></td>
        <td>${esc(b.organization)} <span class="badge kind">${esc(INFO.kinds[b.kind] || '')}</span></td><td>${b.apps}</td><td>${b.uses}</td><td>${b.awards}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">No approved apps yet.</div>'}`
  window.__winners = body.winners
}

async function awards() {
  setNav('awards')
  const { body } = await api('/api/club/leaderboard')
  const winners = body.winners || {}
  $view.innerHTML = `<h1 class="page">Awards</h1>
    <p class="lead">Reviewers recognise approved apps in five categories. Each award comes with a certificate.</p>
    ${ordered('awards').map(([k, label]) => `<h2>${esc(label)}</h2><p class="muted" style="margin-top:-6px">${esc(AWARD_ABOUT[k] || '')}</p>
      <div class="grid">${(winners[k] || []).length ? winners[k].map(card).join('') : '<div class="empty">Not awarded yet.</div>'}</div>`).join('')}`
}

// ── A project ────────────────────────────────────────────────────────────

async function projectPage(id) {
  const { ok, body } = await api('/api/club/projects/' + encodeURIComponent(id) + '?view=1')
  if (!ok) { $view.innerHTML = `<div class="empty" style="margin-top:30px">${esc(body.error || 'Not found')}</div>`; return }
  const p = body.project, u = p.usage || {}
  document.title = `${p.title} · MCN Developer Club`
  const like = !INFO.signed_in ? `<a class="btn ghost" href="/">Sign in to like</a>`
    : p.mine ? '' : `<button class="btn ghost ${p.liked ? 'liked' : ''}" id="like">${p.liked ? 'Liked' : 'Like'}</button>`
  $view.innerHTML = `
    <p style="margin-top:24px"><a href="/club">← Marketplace</a></p>
    <div class="pj-cover" style="${coverStyle(p.category)}"><span class="mono">${esc(monogram(p.title))}</span><span class="cat">${esc(p.category || 'App')}</span></div>
    <div class="pjhead"><div><h1>${esc(p.title)}</h1><div class="lead" style="margin-bottom:8px">${esc(p.tagline || '')}</div>
        <div class="badges">${badges(p)}</div></div>
      <div class="actions"><a class="btn" href="/?club_open=${esc(p.id)}">Open in Studio</a>${like}
        <button class="btn ghost" id="share">Copy link</button></div></div>
    <p class="muted" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${avatar(p.author, 28)} ${author(p)} · approved ${esc(day(p.listed_at))}${p.category ? ' · ' + esc(p.category) : ''}${p.season ? ` · <a href="/club/season/${esc(p.season.id)}">${esc(p.season.name)}</a>` : ''}</p>
    <div class="statrow">
      <div class="stat"><b>${u.uses || 0}</b><span>members using it</span></div>
      <div class="stat"><b id="likes">${u.likes || 0}</b><span>likes</span></div>
      <div class="stat"><b>${u.views || 0}</b><span>views</span></div>
      <div class="stat"><b>${(p.stats || {}).screens || 0}</b><span>screens</span></div>
      <div class="stat"><b>${(p.stats || {}).endpoints || 0}</b><span>endpoints</span></div>
      <div class="stat"><b>${(p.stats || {}).tests || 0}</b><span>tests</span></div>
    </div>
    ${p.description ? `<h2>About</h2><p style="white-space:pre-wrap;max-width:780px">${esc(p.description)}</p>` : ''}
    ${(p.awards || []).length ? `<h2>Awards</h2>${p.awards.map(a => `<div class="note"><b>${esc(a.label)}</b>${a.note ? `<div class="muted">${esc(a.note)}</div>` : ''}</div>`).join('')}` : ''}
    <h2>The app</h2>
    <details><summary>backend/main.mcn</summary><pre>${esc(p.backend || '')}</pre></details>
    <details><summary>ui/app.mcn</summary><pre>${esc(p.ui || '')}</pre></details>`
  document.getElementById('share').onclick = () => navigator.clipboard.writeText(location.href).then(() => toast('Link copied'))
  const btn = document.getElementById('like')
  if (btn) btn.onclick = async () => {
    const want = !btn.classList.contains('liked')
    const r = await api(`/api/club/projects/${encodeURIComponent(p.id)}/like`, { liked: want })
    if (!r.ok) { toast(r.body.error || 'Could not save that'); return }
    btn.classList.toggle('liked', want); btn.textContent = want ? 'Liked' : 'Like'
    document.getElementById('likes').textContent = r.body.likes
  }
}

// ── A developer ──────────────────────────────────────────────────────────

async function profilePage(id) {
  const { ok, body } = await api('/api/club/members/' + encodeURIComponent(id))
  if (!ok) { $view.innerHTML = `<div class="empty" style="margin-top:30px">${esc(body.error || 'Not found')}</div>`; return }
  const m = body.member
  document.title = `${m.name} · MCN Developer Club`
  $view.innerHTML = `
    <h1 class="page">${esc(m.name)}</h1>
    <p class="lead">${esc(INFO.kinds[m.kind] || '')} · ${esc(m.organization)}${m.title ? ' · ' + esc(m.title) : ''}${m.country ? ' · ' + esc(m.country) : ''}<br>
      <span class="muted">Member since ${esc(day(m.joined_at))}</span></p>

async function certificatePage(code) {
  const { ok, body } = await api('/api/club/certificates/' + encodeURIComponent(code))
  if (!ok) {
    $view.innerHTML = `<div class="empty" style="margin-top:30px"><b>Not a valid certificate.</b><br>No MCN Developer Club certificate has the code ${esc(code)}.
      <p><a href="/club/verify">Try another code</a></p></div>`
    return
  }
  const c = body.certificate
  const url = `${location.origin}/club/certificate/${c.code}`
  const title = c.kind === 'award' ? c.award_label : c.kind === 'certified' ? 'Certified MCN Developer' : 'Certificate of Participation'
  const kindLine = c.kind === 'award' ? 'Award of Excellence' : c.kind === 'certified' ? 'Certification' : 'Participation'
  const statement = c.kind === 'award'
    ? `for winning <b>${esc(c.award_label)}</b> in the MCN Developer Club${c.season ? `, <b>${esc(c.season)}</b>,` : ''} with <b>${esc(c.project_title || '')}</b>.`
    : c.kind === 'certified'
      ? `for building <b>${esc(c.project_title || '')}</b> in MCN, reviewed and approved by the MCN Developer Club and listed in its marketplace.`
      : 'for building an application in MCN and launching it for review in the MCN Developer Club.'
  const sig = INFO.signatory
  const issued = new Date(c.issued_at * 1000)
  document.title = `${title} · ${c.holder}`
  $view.innerHTML = `
    <div class="cert-wrap">
      <div class="sheet ${esc(c.kind)}">
        <div class="frame"></div>
        ${['tl', 'tr', 'bl', 'br'].map(p => `<svg class="corner ${p}"><use href="#corner"/></svg>`).join('')}
        <div class="inner">
          <svg class="emblem"><use href="#emblem"/></svg>
          <div class="club-name">MCN Developer Club</div>
          <div class="cert-title">${esc(title)}</div>
          <div class="cert-kind">${esc(kindLine)}${c.season ? ' · ' + esc(c.season) : ''}</div>
          <div class="presented">This is proudly presented to</div>
          <div class="holder">${esc(c.holder)}</div>
          <div class="holder-org">${esc(c.organization)}${c.holder_kind ? ' · ' + esc(INFO.kinds[c.holder_kind] || '') : ''}</div>
          <div class="statement">${statement}</div>
          <div class="foot">
            <div class="col"><div class="big">${esc(day(c.issued_at))}</div><div class="line">Date issued</div></div>
            <svg class="seal"><use href="#seal"/></svg>
            <div class="col right"><div class="big">${esc(sig ? sig.name : 'MCN Developer Club')}</div>
              <div class="line">${esc(sig ? sig.title : 'Issued by')}</div></div>
          </div>
        </div>
        <div class="qr"><span>Verify this certificate<br><b>${esc(c.code)}</b></span><span id="qr"></span></div>
      </div>
    </div>
    <div class="cert-tools no-print">
      <button class="btn" onclick="print()">Download PDF</button>
      <a class="btn ghost" target="_blank" rel="noopener" href="https://www.linkedin.com/profile/add?${new URLSearchParams({
        startTask: 'CERTIFICATION_NAME', name: title + (c.project_title ? ': ' + c.project_title : ''), organizationName: 'MCN Developer Club',
        issueYear: issued.getFullYear(), issueMonth: issued.getMonth() + 1, certUrl: url, certId: c.code })}">Add to LinkedIn</a>
      <button class="btn ghost" id="copy">Copy link</button>
    </div>
    <p class="valid no-print">✓ Valid certificate, issued to ${esc(c.holder)} on ${esc(day(c.issued_at))} by the MCN Developer Club.</p>`
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(url).then(() => toast('Link copied'))
  try {
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make()
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
  } catch { document.getElementById('qr').remove() }
}

const STATUS = { in_review: 'In review', approved: 'Approved', changes_requested: 'Changes requested',
  rejected: 'Not approved', withdrawn: 'Withdrawn' }
const num = v => v == null ? '–' : (Math.round(v * 10) / 10).toString()
const rubric = () => ordered('rubric')
function go(path, render) { history.pushState(null, '', path); render() }
window.addEventListener('popstate', () => route())

function tabs(base, list, on, fn) {
  return `<div class="tabs">${list.map(([k, l]) => `<button class="${k === on ? 'on' : ''}" onclick="go('${base}/${k}', () => ${fn}('${k}'))">${l}</button>`).join('')}</div>`
}

function scoreLine(sc) {
  if (!sc || !sc.reviewers) return ''
  return `<div class="scores">${rubric().map(([k, l]) => `<span>${esc(l)} <b>${num(sc.averages[k])}</b></span>`).join('')}
    <span>Overall <b>${num(sc.total)}</b>/5 from ${sc.reviewers} reviewer${sc.reviewers === 1 ? '' : 's'}</span></div>`
}

function joinForm(m = {}) {
  return `<form class="form" id="join">
    <label>Your name<input name="name" required maxlength="80" value="${esc(m.name)}"></label>
    <label>I am a<select name="kind">
      <option value="student" ${m.kind !== 'professional' ? 'selected' : ''}>Student</option>
      <option value="professional" ${m.kind === 'professional' ? 'selected' : ''}>Professional</option></select></label>
    <label><span id="org-label">${m.kind === 'professional' ? 'Company' : 'College or university'}</span><input name="organization" required maxlength="120" value="${esc(m.organization)}"></label>
    <label>Course and year, or job title (optional)<input name="title" maxlength="80" value="${esc(m.title)}"></label>
    <label>Country (optional)<input name="country" maxlength="60" value="${esc(m.country)}"></label>

      <label>What you build (optional)<input name="skills" maxlength="200" placeholder="e.g. dashboards, AI assistants, IoT, phone apps" value="${esc(m.skills)}"></label>

      <span class="muted">Only this link is shown, never your email address.</span></fieldset>` : ''}

}

function wireJoin(after) {
  const f = document.getElementById('join')
  f.kind.onchange = () => { document.getElementById('org-label').textContent = f.kind.value === 'student' ? 'College or university' : 'Company' }
  f.onsubmit = async e => {
    e.preventDefault()
    const data = Object.fromEntries(new FormData(f).entries())
    data.available = !!(f.available && f.available.checked)
    const r = await api('/api/club/join', data)
    if (!r.ok) { document.getElementById('join-err').textContent = r.body.error || 'Could not save that'; return }
    toast(after); location.href = '/club/me'
  }
}

async function reviewPage(tab, openId) {
  setNav('review')
  if (!(ME && ME.is_reviewer)) { $view.innerHTML = `<div class="empty" style="margin-top:30px">Reviewing is for club reviewers.</div>`; return }
  const r = await api('/api/club/review')
  if (!r.ok) { $view.innerHTML = `<div class="empty" style="margin-top:30px">${esc(r.body.error)}</div>`; return }
  const { queue, stats } = r.body
  $view.innerHTML = `<h1 class="page">Review</h1>
    <p class="lead">Review launched apps, score them on the rubric, run seasons and give awards. Scores are private to reviewers;
      developers see only the average on each criterion.</p>
    ${tabs('/club/review', [['queue', `Queue (${queue.length})`], ['approved', 'Approved apps'], ['seasons', 'Seasons'], ['dashboard', 'Dashboard']], tab, 'reviewPage')}
    <div id="pane"></div>`
  const pane = document.getElementById('pane')
  if (tab === 'dashboard') return reviewDashboard(pane, stats)
  if (tab === 'seasons') return reviewSeasons(pane)
  if (tab === 'approved') return reviewApproved(pane, openId)
  pane.innerHTML = `<div class="split"><div class="list">${queue.length ? queue.map(p => `<div class="card qitem" data-open="${esc(p.id)}">
      <div class="row"><b>${esc(p.title)}</b><span class="muted">v${p.version}</span></div>
      <div class="muted">${esc(p.author)} · ${esc(p.author_org)}</div>
      <div class="muted">${count(p.stats.screens, 'screen')} · ${count(p.stats.endpoints, 'endpoint')} · ${count(p.stats.tests, 'test')}${p.stats.uses_ai ? ' · AI' : ''}</div></div>`).join('')
    : '<div class="empty">Nothing waiting for review.</div>'}</div><div id="detail"></div></div>`
  wireOpen(pane)
  const first = openId || (queue[0] && queue[0].id)
  if (first) openReview(first, !!openId)
}

function wireOpen(root) {
  root.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openReview(el.dataset.open))
}

async function openReview(id, scroll = true) {
  document.querySelectorAll('.qitem').forEach(el => el.classList.toggle('on', el.dataset.open === id))
  const box = document.getElementById('detail')
  const r = await api('/api/club/review/' + encodeURIComponent(id))
  if (!r.ok) { box.innerHTML = `<div class="empty">${esc(r.body.error)}</div>`; return }
  const p = r.body.project, c = r.body.checks, have = (r.body.mine && r.body.mine.scores) || {}
  const help = INFO.rubric_help || {}
  const list = (title, items) => items.length ? `<div class="note"><b>${title}</b><ul>${items.slice(0, 8).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>` : ''
  box.innerHTML = `<div class="card">
    <div class="row"><h3>${esc(p.title)}</h3><span class="status s-${p.status}">${STATUS[p.status] || esc(p.status)}</span></div>
    <div class="muted">${esc(p.tagline || '')}</div>
    <div class="muted">${esc(p.author)} · ${esc(INFO.kinds[p.author_kind] || '')} · ${esc(p.author_org)}${p.category ? ' · ' + esc(p.category) : ''}${p.season ? ' · ' + esc(p.season.name) : ''}</div>
    ${p.description ? `<p style="white-space:pre-wrap;margin:4px 0">${esc(p.description)}</p>` : ''}
    <div class="muted">Checks: ${c.screens} screens, ${c.endpoints} endpoints, ${c.tables} tables, ${c.tests} tests${c.uses_ai ? ', uses AI' : ''}${!c.type_errors.length && !c.issues.length ? ' · no problems found' : ''}</div>
    ${list('Type errors', c.type_errors)}${list('App map problems', c.issues)}
    <details><summary>backend/main.mcn</summary><pre>${esc(p.backend || '')}</pre></details>
    <details><summary>ui/app.mcn</summary><pre>${esc(p.ui || '')}</pre></details>
    <h2 style="margin:14px 0 0">Score it</h2>
    <div>${rubric().map(([k, label]) => `<div class="crit"><div><b style="font-weight:550">${esc(label)}</b><div class="muted">${esc(help[k] || '')}</div></div>
      <div class="dots" role="radiogroup" aria-label="${esc(label)}">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" name="crit-${k}" value="${n}" ${have[k] === n ? 'checked' : ''}><span>${n}</span></label>`).join('')}
        ${k === 'ai' ? `<label><input type="radio" name="crit-${k}" value="na" ${k in have && have[k] == null ? 'checked' : ''}><span>N/A</span></label>` : ''}</div></div>`).join('')}</div>
    <input class="field" id="score-note" placeholder="A note for other reviewers (optional)" value="${esc((r.body.mine && r.body.mine.note) || '')}">
    <div class="row"><button class="btn sm ghost" id="save-scores">Save scores</button>
      <span class="muted" id="score-sum">${p.scores && p.scores.reviewers ? `Average ${num(p.scores.total)}/5 from ${p.scores.reviewers} reviewer(s)` : 'Not scored yet'}</span></div>
    ${p.status === 'in_review' ? `<h2 style="margin:14px 0 0">Decision</h2>
      <textarea class="field" id="notes" rows="3" placeholder="Notes for the developer (needed to request changes or reject)"></textarea>
      <div class="err" id="decide-err"></div>
      <div class="actions"><button class="btn" data-decide="approve">Approve</button>
        <button class="btn ghost" data-decide="changes">Request changes</button><button class="btn ghost" data-decide="reject">Reject</button></div>` : ''}
  </div>`
  document.getElementById('save-scores').onclick = async () => {
    const scores = {}
    for (const [k] of rubric()) { const x = box.querySelector(`input[name="crit-${k}"]:checked`); scores[k] = x ? x.value : null }
    const s = await api(`/api/club/review/${encodeURIComponent(id)}/score`, { scores, note: document.getElementById('score-note').value })
    if (!s.ok) { toast(s.body.error || 'Could not save the scores'); return }
    const sc = s.body.project.scores
    document.getElementById('score-sum').textContent = `Average ${num(sc.total)}/5 from ${sc.reviewers} reviewer(s)`
    toast('Scores saved')
  }
  box.querySelectorAll('[data-decide]').forEach(b => b.onclick = async () => {
    const d = await api('/api/club/review/' + encodeURIComponent(id), { decision: b.dataset.decide, notes: document.getElementById('notes').value })
    if (!d.ok) { document.getElementById('decide-err').textContent = d.body.error; return }
    toast(b.dataset.decide === 'approve' ? 'Approved: it is in the marketplace and the developer has a certificate' : 'Sent back to the developer')
    reviewPage('queue')
  })
  if (scroll) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

  let note = ''
  if (!remove) { note = prompt('A line on why (shown on the app page). Optional.', ''); if (note === null) return false }
  const r = await api(`/api/club/review/${encodeURIComponent(id)}/award`, { category, note, remove })
  if (!r.ok) { toast(r.body.error || 'Could not save that'); return false }
  toast(remove ? 'Award removed' : 'Award given, with a certificate'); return true
}

        return `<button class="pill-btn ${has ? 'on' : ''}" data-award="${k}" data-id="${esc(p.id)}" data-has="${has ? 1 : ''}">${esc(l)}</button>` }).join('')}</div>
      <label class="muted" style="display:flex;gap:8px;align-items:center">Spotlight <select class="field" style="width:auto;padding:4px 8px" data-spot="${esc(p.id)}">
        <option value="">None</option>${ordered('spotlights').map(([k, l]) => `<option value="${k}" ${p.spotlight === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
    </div>`).join('') : '<div class="empty">No approved apps yet.</div>'}</div>
    <div id="detail">${market.length ? '<div class="empty">Pick an app to score it.</div>' : ''}</div></div>`
  wireOpen(pane)
  pane.querySelectorAll('[data-award]').forEach(b => b.onclick = async e => {
    e.stopPropagation()
    if (await giveAward(b.dataset.id, b.dataset.award, !!b.dataset.has)) { b.dataset.has = b.dataset.has ? '' : '1'; b.classList.toggle('on', !!b.dataset.has) }
  })
  pane.querySelectorAll('[data-spot]').forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => setSpotlight(s.dataset.spot, s.value) })
  if (openId) openReview(openId)
}

async function reviewSeasons(pane) {
  const list = (await api('/api/club/seasons')).body.seasons || []
  const admin = INFO.is_admin
  pane.innerHTML = `<div class="list">${list.length ? list.map(se => `<div class="card">
      <div class="row"><h3>${esc(se.name)}</h3><span class="status s-${se.status}">${esc(se.status_label)}</span></div>
      <div class="muted">${se.theme ? esc(se.theme) + ' · ' : ''}${esc(day(se.starts_at))} to ${esc(day(se.ends_at))} · ${se.entries} entries, ${se.approved} approved</div>
      <div class="actions"><button class="btn sm" data-standings="${esc(se.id)}">Standings and suggested winners</button>
        <a class="btn sm ghost" href="/club/season/${esc(se.id)}">Public page</a>
        ${admin ? `<button class="btn sm ghost" data-publish="${esc(se.id)}" data-on="${se.status !== 'closed' ? 1 : ''}">${se.status === 'closed' ? 'Hide results' : 'Publish results'}</button>` : ''}</div>
      <div data-standings-box="${esc(se.id)}"></div>
    </div>`).join('') : '<div class="empty">No seasons yet.</div>'}
    ${admin ? `<details class="card"><summary>New season</summary><form class="form" id="new-season" style="margin-top:12px">
      <label>Name<input name="name" required maxlength="60" placeholder="e.g. Spring 2027"></label>
      <label>Theme (optional)<input name="theme" maxlength="120" placeholder="e.g. AI for healthcare"></label>
      <label>Opens<input name="starts" type="date" required></label>
      <label>Entries close<input name="ends" type="date" required></label>
      <label>About it (optional)<textarea name="description" rows="3" maxlength="2000"></textarea></label>
      <div><button class="btn">Create season</button></div></form></details>` : ''}</div>`
  pane.querySelectorAll('[data-standings]').forEach(b => b.onclick = () => standings(b.dataset.standings))
  pane.querySelectorAll('[data-publish]').forEach(b => b.onclick = async () => {
    const on = !!b.dataset.on
    if (on && !confirm('Publish the results? The season closes and its winners appear on its public page.')) return
    const r = await api('/api/club/seasons/' + encodeURIComponent(b.dataset.publish), { results_published: on })
    if (!r.ok) { toast(r.body.error || 'Could not save that'); return }
    reviewSeasons(pane)
  })
  const f = document.getElementById('new-season')
  if (f) f.onsubmit = async e => {
    e.preventDefault()
    const v = Object.fromEntries(new FormData(f).entries())
    const r = await api('/api/club/seasons', { name: v.name, theme: v.theme, description: v.description,
      starts_at: new Date(v.starts + 'T00:00:00').getTime() / 1000, ends_at: new Date(v.ends + 'T23:59:59').getTime() / 1000 })
    if (!r.ok) { toast(r.body.error || 'Could not create it'); return }
    toast(`${r.body.season.name} created`); reviewSeasons(pane)
  }
}

async function standings(id) {
  const box = document.querySelector(`[data-standings-box="${CSS.escape(id)}"]`)
  const r = await api(`/api/club/seasons/${encodeURIComponent(id)}/standings`)
  if (!r.ok) { box.innerHTML = `<div class="err">${esc(r.body.error)}</div>`; return }
  const d = r.body, short = INFO.rubric_short || {}
  box.innerHTML = `${d.ranked.length ? `<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>App</th>
      ${rubric().map(([k, l]) => `<th title="${esc(l)}">${esc(short[k] || l)}</th>`).join('')}<th>Avg</th><th>Using</th></tr></thead>
      <tbody>${d.ranked.map((p, i) => `<tr><td>${i + 1}</td><td><a href="#" data-score="${esc(p.id)}">${esc(p.title)}</a><div class="muted">${esc(p.author_org)} · ${p.scores.reviewers} reviewer(s)</div></td>
        ${rubric().map(([k]) => `<td>${num(p.scores.averages[k])}</td>`).join('')}<td><b>${num(p.scores.total)}</b></td><td>${p.usage.uses}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="muted" style="margin-top:8px">No approved entries in this season yet.</div>'}
    <h3 style="margin:16px 0 6px;font-size:15px">Suggested winners</h3>
    ${ordered('awards').filter(([k]) => d.suggestions[k]).map(([award]) => [award, d.suggestions[award]]).map(([award, s]) => {
      const entry = d.ranked.find(p => p.id === s.project_id), has = entry && entry.awards.some(a => a.category === award)
      return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(INFO.awards[award])}: <b>${esc(s.title)}</b> <span class="muted">(${num(s.score)}/5)</span></span>
        ${has ? '<span class="status s-approved">Awarded</span>' : `<button class="btn sm" data-give="${esc(award)}" data-id="${esc(s.project_id)}">Give award</button>`}</div>`
    }).join('') || '<div class="muted">Score the entries to see suggestions.</div>'}
    ${d.peoples_choice ? `<div class="row" style="padding:6px 0"><span>People's Choice (most used): <b>${esc(d.peoples_choice.title)}</b> <span class="muted">(${d.peoples_choice.uses} members)</span></span>
      <button class="btn sm ghost" id="pc-${esc(id)}">Spotlight for recognition</button></div>` : ''}`
  box.querySelectorAll('[data-give]').forEach(b => b.onclick = async () => { if (await giveAward(b.dataset.id, b.dataset.give, false)) standings(id) })
  box.querySelectorAll('[data-score]').forEach(a => a.onclick = e => { e.preventDefault(); go('/club/review/approved', () => reviewPage('approved', a.dataset.score)) })
  const pc = document.getElementById('pc-' + id)
  if (pc) pc.onclick = () => setSpotlight(d.peoples_choice.project_id, 'recognition')
}

function reviewDashboard(pane, stats) {
  const s = stats.projects_by_status
  pane.innerHTML = `<div class="statrow">${[['Members', stats.members], ['Students', stats.members_by_kind.student], ['Professionals', stats.members_by_kind.professional],
      ['In review', s.in_review], ['Approved', s.approved], ['Certificates', stats.certificates], ['Approved using AI', stats.approved_using_ai]]
      .map(([l, n]) => `<div class="stat"><b>${n || 0}</b><span>${l}</span></div>`).join('')}</div>
    <h2>Awards and spotlights</h2>
    <div class="badges">${ordered('awards').map(([k, l]) => `<span class="badge award">${esc(l)} · ${stats.awards[k] || 0}</span>`).join('')}
      ${ordered('spotlights').map(([k, l]) => `<span class="badge spot">${esc(l)} · ${stats.spotlights[k] || 0}</span>`).join('')}</div>
    ${(stats.top_used || []).length ? `<h2>Most used</h2><table><thead><tr><th>App</th><th>College or company</th><th>Using</th><th>Likes</th></tr></thead>
      <tbody>${stats.top_used.map(p => `<tr><td><a href="/club/project/${esc(p.id)}">${esc(p.title)}</a></td><td>${esc(p.author_org)}</td><td>${p.uses || 0}</td><td>${p.likes || 0}</td></tr>`).join('')}</tbody></table>` : ''}
    ${stats.top_organizations.length ? `<h2>Top colleges and companies</h2><table><thead><tr><th>College or company</th><th>Approved apps</th></tr></thead>
      <tbody>${stats.top_organizations.map(o => `<tr><td>${esc(o.organization)}</td><td>${o.approved}</td></tr>`).join('')}</tbody></table>` : ''}`
}

async function route() {
  const [info, se] = await Promise.all([api('/api/club/info'), api('/api/club/seasons')])
  if (info.ok) INFO = info.body
  SEASONS = (se.body && se.body.seasons) || []
  if (INFO.signed_in) { const r = await api('/api/club/me'); ME = r.ok ? r.body : null }
  const me = INFO.member
  const who = document.getElementById('who')
  if (INFO.signed_in) { who.className = 'who'; who.href = '/club/me'; who.innerHTML = me ? `${avatar(me.name, 26)}${esc(me.name.split(' ')[0])}` : 'My club' }
  else { who.className = 'who out'; who.href = '/?signin=club'; who.textContent = 'Sign in' }
  document.getElementById('nav-review').hidden = !(ME && ME.is_reviewer)
  const [, , view, arg] = location.pathname.split('/').map(decodeURIComponent)
  if (view === 'me') return myClub(arg || 'projects')
  if (view === 'review') return reviewPage(arg || 'queue')
  if (view === 'project' && arg) return projectPage(arg)
  if (view === 'certificate' && arg) return certificatePage(arg)
  if (view === 'u' && arg) return profilePage(arg)
  if (view === 'seasons') return seasonsPage()
  if (view === 'season' && arg) return seasonPage(arg)
  if (view === 'leaderboard') return leaderboard()
  if (view === 'awards') return awards()
  if (view === 'verify') return verifyPage()
  if (view === 'builders') return buildersPage()
  return marketplace()
}
route()
</script>
